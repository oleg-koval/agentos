<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AgentOS Workstation</title>
  <desc id="desc">A calm operations workflow from inspection through a signed update to a boot-safe recovery point.</desc>
  <rect width="1200" height="630" fill="#101d27"/>
  <path d="M70 82h42l22-55 48 110 28-55h42" fill="none" stroke="#65d3c7" stroke-width="11"/>
  <text x="70" y="205" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700">AgentOS Workstation</text>
  <text x="70" y="267" fill="#b9cbc9" font-family="Arial, Helvetica, sans-serif" font-size="32">Reliable Arch Linux for AI-assisted work.</text>
  <line x1="70" y1="350" x2="1130" y2="350" stroke="#526b72" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="105" cy="435" r="24" fill="none" stroke="#65d3c7" stroke-width="3"/>
    <text x="96" y="445" fill="#eaf0ed" font-size="28">1</text>
    <text x="150" y="425" fill="#ffffff" font-size="26" font-weight="700">Inspect</text>
    <text x="150" y="462" fill="#9bdcd4" font-family="monospace" font-size="21">update --check</text>
    <line x1="330" y1="435" x2="400" y2="435" stroke="#526b72" stroke-width="3"/>
    <circle cx="435" cy="435" r="24" fill="none" stroke="#65d3c7" stroke-width="3"/>
    <text x="426" y="445" fill="#eaf0ed" font-size="28">2</text>
    <text x="480" y="425" fill="#ffffff" font-size="26" font-weight="700">Converge</text>
    <text x="480" y="462" fill="#9bdcd4" font-family="monospace" font-size="21">signed update</text>
    <line x1="675" y1="435" x2="745" y2="435" stroke="#526b72" stroke-width="3"/>
    <circle cx="780" cy="435" r="24" fill="none" stroke="#65d3c7" stroke-width="3"/>
    <text x="771" y="445" fill="#eaf0ed" font-size="28">3</text>
    <text x="825" y="425" fill="#ffffff" font-size="26" font-weight="700">Recover</text>
    <text x="825" y="462" fill="#9bdcd4" font-family="monospace" font-size="21">next boot only</text>
  </g>
  <rect x="70" y="540" width="1060" height="4" fill="#007c78"/>
  <text x="70" y="587" fill="#b9cbc9" font-family="Arial, Helvetica, sans-serif" font-size="23">Physical workstations · already-provisioned Arch VPS hosts</text>
</svg>
